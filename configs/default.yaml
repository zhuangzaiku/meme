execution_mode: paper

risk:
  risk_per_trade: 0.0025
  max_position_percent: 0.03
  max_concurrent_positions: 5
  max_narrative_exposure: 0.08
  max_slippage_percent: 1.5
  daily_loss_limit: 0.015
  max_consecutive_losses: 3
  reserve_balance_percent: 20
  cooldown_after_exit_minutes: 30
  allow_averaging_down: false

market:
  proxy_url: http://127.0.0.1:7890
  discovery_interval_seconds: 60
  max_pools_per_chain: 2
  max_log_block_span: 25
  http_timeout_seconds: 10
  collection_timeout_seconds: 10
  max_retries: 3
  per_chain:
    bnb:
      poll_interval_seconds: 5
      collection_timeout_seconds: 10
    robinhood:
      poll_interval_seconds: 15
      collection_timeout_seconds: 30
    sol:
      poll_interval_seconds: 10
      collection_timeout_seconds: 20

external:
  enabled: true
  gmgn_base_url: https://papi.gmgn.ai/callout/openapi/v1
  gmgn_ak_env: GMGN_AK
  gmgn_sk_env: GMGN_SK
  max_tokens_per_cycle: 2

native_discovery:
  enabled: true
  initial_backfill_blocks: 500
  max_log_block_span: 1000
  max_pools_per_protocol: 50
  stale_cache_seconds: 300
  protocols:
    pancakeswap_v2:
      enabled: true
      chain: bnb
      contract_address: "0xca143ce32fe78f1f7019d7d551a6402fc5350c73"
      event_kind: v2_pair_created
      dex_id: pancakeswap-v2
    pancakeswap_v3:
      enabled: true
      chain: bnb
      contract_address: "0x0bfbcf9fa4f9c56b0f40a671ad40e0805a091865"
      event_kind: v3_pool_created
      dex_id: pancakeswap-v3

chains:
  bnb:
    name: BNB Smart Chain
    chain_id: 56
    rpc_http: null
    rpc_ws: null
    native_symbol: BNB
  robinhood:
    name: Robinhood Chain
    chain_id: null
    rpc_http: null
    rpc_ws: null
    native_symbol: null
  sol:
    name: Solana Mainnet
    chain_id: null
    rpc_http: null
    rpc_ws: null
    native_symbol: SOL
    rpc_kind: solana
